# Configuración de despliegue en Netlify

[build]
  command = "npm run build"
  publish = "dist"

# SPA: cualquier ruta que no sea un archivo estático sirve index.html
# (necesario para el router del lado del cliente).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker no debe cachearse de forma agresiva (así se actualiza).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
